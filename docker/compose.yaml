services:
  open-webui:
    image: ${WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.12.5}
    container_name: ${WEBUI_CONTAINER:-open-webui}
    restart: unless-stopped

    ports:
      - "${WEBUI_HOST_IP:-127.0.0.1}:${WEBUI_HOST_PORT:-3000}:8080"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - open-webui:/app/backend/data

    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      WEBUI_NAME: ${JARVIS_NAME:-Dum-E}
      DEPLOYMENT_ID: ${JARVIS_DEPLOYMENT_ID:-jarvis}
      EXTERNAL_PWA_MANIFEST_URL: ${EXTERNAL_PWA_MANIFEST_URL:-}

volumes:
  open-webui:
    name: ${WEBUI_VOLUME:-open-webui}
