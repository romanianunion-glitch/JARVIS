# JARVIS shared configuration

app:
  name: Dum-E
  version: "0.1.0"

webui:
  container: open-webui
  image: ghcr.io/open-webui/open-webui
  host_port: 3000
  container_port: 8080
  volume: open-webui

ollama:
  host: localhost
  port: 11434

models:
  cloud: "-jarvis-cloud"
  private: "-jarvis-local"

security:
  require_command_approval: true
  allow_tailscale_funnel: false
